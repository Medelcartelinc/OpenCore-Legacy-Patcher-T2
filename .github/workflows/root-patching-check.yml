name: Check root patching for boot-breaking problems

# Fails when root patching could leave a Mac that no longer boots: a patchset
# that deletes or replaces the kernel, the Kernel Collections, boot.efi or a
# core kext, a failed copy that goes unnoticed, a new APFS snapshot blessed
# after something already went wrong, a SYSTEM_VOLUME patch that lands on the
# live root instead of the mounted copy (059cc9a), a missing FileVault/SIP/
# AMFI/Secure Boot gate, or Metal and non-Metal patches installed together.
#
# .github/scripts/check_root_patching.py runs the real patchsets, the real
# detection gates and the real sys_patch flow with every host value simulated
# (see the script for the cases). It runs alongside the SecureBootModel check
# (secure-boot-model-check.yml), which covers the EFI side.
#
# Pull requests:
#   Runs on `pull_request` with a read-only token, because the check imports
#   and runs the PR's code. The check script itself always comes from the base
#   branch, so a PR can't change what is checked. The result is uploaded as an
#   artifact; root-patching-comment.yml (workflow_run, trusted) reads it as
#   data and posts/updates the PR comment. Problems that already exist on the
#   base branch are listed separately and don't fail the PR.
#
# Outside pull requests (push to main, releases, weekly, manual):
#   The whole tree is checked and the result is kept in one tracking issue
#   ("Root patching check: boot-breaking problems on main"). It is updated on
#   every run and closed automatically once everything passes. A check that
#   can't run at all is reported too.

on:
  # No `paths` filter for PRs: with one, PRs that don't touch the patcher get
  # no check at all (nothing on the PR, and a required check would wait
  # forever). The "Decide what to check" step skips the expensive part instead.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "opencore_legacy_patcher/**"
      - "payloads/Config/**"
      - "requirements.txt"
      - ".github/scripts/check_root_patching.py"
      - ".github/workflows/root-patching-check.yml"
  release:
    types: [published]
  schedule:
    - cron: "45 6 * * 1"   # Mondays 06:45 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-patching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # What sys_patch imports besides the macOS-only modules (pyobjc, wx, ...),
  # which the script replaces with inert stubs on Linux.
  CHECK_DEPS: "requests packaging py_sip_xnu markdown markdown2"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PRs that change nothing the root patcher or the check depends on pass
      # right away - their root patching is identical to main's, checked on push.
      - name: Decide what to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "::warning::Couldn't list the PR's files - checking everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(printf '%s\n' "$files" | grep -E '^(opencore_legacy_patcher/|payloads/Config/|requirements\.txt$|\.github/scripts/check_root_patching\.py$|\.github/workflows/root-patching-check\.yml$)' || true)
          if [ -n "$relevant" ]; then
            echo "Relevant changes:"; printf '  %s\n' $relevant
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "This PR doesn't change the patcher, payloads/Config or the check - nothing to check"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to check
        if: steps.scope.outputs.run != 'true'
        run: |
          out="$RUNNER_TEMP/root-patching"
          mkdir -p "$out"
          # A clean result, so an earlier complaint on this PR is resolved
          echo '{"fatal": null, "cases": {}, "new": [], "known": [], "errors": [], "not_relevant": true}' > "$out/result.json"
          echo "rc=0" > "$out/rc"
          echo "## Root patching check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ This PR doesn't change the patcher, \`payloads/Config\` or the check - nothing to check." >> "$GITHUB_STEP_SUMMARY"

      # Trusted copy: the base branch for PRs, otherwise the pushed/released commit.
      # The check script is always taken from here.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      # The PR (merged with its base, as GitHub tests it). Its code is executed
      # by the check - fine here, this job can't write anything.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && steps.scope.outputs.run == 'true'
        with:
          path: pr
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check $CHECK_DEPS

      - name: Check root patching
        id: check
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          out="$RUNNER_TEMP/root-patching"
          mkdir -p "$out"
          script="trusted/.github/scripts/check_root_patching.py"

          if [ ! -f "$script" ]; then
            # The base branch doesn't have the check yet (e.g. the PR that adds it)
            echo "::notice::$script doesn't exist on the base branch yet - nothing to check"
            echo "skipped" > "$out/skipped"
            echo "rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            python3 "$script" --root pr --baseline trusted \
              --json "$out/result.json" --summary "$out/summary.md"
            rc=$?
            # Only used to find the PR again - the commenter re-checks it against the API
            printf '{"number": %s, "head_sha": "%s"}\n' "$PR_NUMBER" "$PR_HEAD_SHA" > "$out/pr.json"
          else
            python3 "$script" --root trusted \
              --json "$out/result.json" --summary "$out/summary.md"
            rc=$?
          fi
          echo "rc=$rc" > "$out/rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ -f "$out/summary.md" ] && cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-patching-result
          path: ${{ runner.temp }}/root-patching/
          # The repo caps artifact retention at 1 day; the commenter reads it right away
          retention-days: 1
          if-no-files-found: ignore

      - name: Fail if root patching could leave a Mac unbootable
        if: steps.check.outputs.rc != '' && steps.check.outputs.rc != '0'
        run: |
          if [ "${{ steps.check.outputs.rc }}" = "2" ]; then
            echo "::error::The root patching check could not run - see the log above"
          else
            echo "::error::Root patching could leave a Mac unbootable - see the summary"
          fi
          exit 1

  # Outside PRs: keep the result in one tracking issue.
  report:
    needs: check
    if: >-
      always() && needs.check.result != 'skipped' && needs.check.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: root-patching-result
          path: ${{ runner.temp }}/result

      - name: Update tracking issue
        uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- root-patching-main-report -->';
            const TITLE = 'Root patching check: boot-breaking problems on main';
            const MAX = 150;
            const { owner, repo } = context.repo;
            const dir = `${process.env.RUNNER_TEMP}/result`;
            const sha = context.sha, short = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const isRelease = context.eventName === 'release';
            const tag = isRelease ? context.payload.release.tag_name : null;
            const where = isRelease ? `release \`${tag}\` (${short})` : `\`main\` (at ${short})`;

            if (fs.existsSync(`${dir}/skipped`)) return;

            let result = null;
            try { result = JSON.parse(fs.readFileSync(`${dir}/result.json`, 'utf8')); } catch {}
            const fatal = !result ? `no result was produced (check job: ${process.env.CHECK_RESULT})` : result.fatal;
            const problems = result && Array.isArray(result.new) ? result.new : [];
            const errors = result && Array.isArray(result.errors) ? result.errors : [];

            const esc = s => String(s).replace(/[|`<>\[\]]/g, c => ({ '|': '\\|', '`': "'", '<': '&lt;', '>': '&gt;', '[': '\\[', ']': '\\]' }[c])).replace(/@/g, '@\u200b').slice(0, 500);

            // Only our own issue - anybody can paste the marker into an issue
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', creator: 'github-actions[bot]', per_page: 100 });
            const ours = issues.filter(i => !i.pull_request && i.body && i.body.includes(MARKER));
            const existing = ours.find(i => i.state === 'open') || ours[0];

            if (!fatal && !problems.length) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body:
                  `✅ ${where}: no root-patching problem that could leave a Mac unbootable was found anymore ([run](${runUrl})). Closing.\n\n` +
                  `✅ ${where}: Kein Root-Patching-Problem mehr gefunden, das einen Mac unbootbar machen könnte. Wird geschlossen.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            let body =
              `${MARKER}\n` +
              (isRelease ? `> [!CAUTION]\n> **Release \`${tag}\` is affected.** Root patching in this release can leave a Mac that no longer boots - ` +
                           `consider pulling it or marking it as broken before people update.\n\n` : '') +
              `Automatic report of the root patching check on ${where}, [run](${runUrl}). ` +
              `Updated on every push to \`main\`, every release and every Monday; closed automatically once everything passes.\n\n` +
              `**Why this matters:** root patching edits a copy of the sealed system volume and then blesses a new APFS snapshot of it. ` +
              `Whatever is in that snapshot is what the Mac boots next - a deleted kernel or core kext, a half-finished copy, a snapshot ` +
              `created after a step already failed, or a patch written to the live root instead of the mounted copy all end in a Mac that doesn't start.\n\n` +
              `<details><summary>Deutsch</summary>\n\n` +
              `Automatischer Bericht des Root-Patching-Checks auf ${where}. Wird bei jedem Push auf \`main\`, jedem Release und jeden Montag aktualisiert ` +
              `und automatisch geschlossen, sobald alles besteht.\n\n` +
              `**Warum das wichtig ist:** Root Patching bearbeitet eine Kopie des versiegelten System-Volumes und erzeugt danach einen neuen APFS-Snapshot davon. ` +
              `Was in diesem Snapshot steckt, bootet der Mac beim nächsten Start - ein gelöschter Kernel oder Kern-Kext, eine halb fertige Kopie, ein Snapshot ` +
              `nach einem bereits fehlgeschlagenen Schritt oder ein Patch auf das laufende statt das gemountete Root-Volume enden alle in einem Mac, der nicht mehr startet.\n` +
              (isRelease ? `\n**Release \`${tag}\` ist betroffen** - ggf. zurückziehen oder als defekt markieren.\n` : '') +
              `</details>\n\n`;

            if (fatal) {
              body += `## ❌ The check could not run\n\n\`${esc(fatal)}\`\n\n` +
                      `Until it runs again, nothing protects against these bugs. See the [run log](${runUrl}).\n\n` +
                      `Der Check konnte nicht laufen - bis er wieder läuft, schützt nichts vor diesen Fehlern.\n\n`;
            }
            if (problems.length) {
              body += `## ❌ ${problems.length} problem(s)\n\n| Case | Where | Problem |\n|---|---|---|\n` +
                      problems.slice(0, MAX).map(p => `| \`${esc(p.case)}\` | \`${esc(p.subject)}\` | ${esc(p.message)} |`).join('\n') +
                      (problems.length > MAX ? `\n\n…and ${problems.length - MAX} more - see the [run log](${runUrl}).` : '') + `\n\n`;
            }
            if (result && result.cases) {
              body += `<details><summary>Cases</summary>\n\n| Case | Checked | Problems | Couldn't check |\n|---|---|---|---|\n` +
                      Object.entries(result.cases).map(([k, c]) => `| \`${esc(k)}\` | ${+c.checked || 0} | ${+c.problems || 0} | ${+c.errors || 0} |`).join('\n') +
                      `\n</details>\n`;
            }
            if (errors.length) {
              body += `\n<details><summary>${errors.length} scenario(s) couldn't be checked</summary>\n\n| Case | Where | Error |\n|---|---|---|\n` +
                      errors.slice(0, 50).map(e => `| \`${esc(e.case)}\` | \`${esc(e.subject)}\` | ${esc(e.message)} |`).join('\n') + `\n</details>\n`;
            }
            if (body.length > 65000) body = body.slice(0, 64000) + `\n\n…truncated - see the [run log](${runUrl}).`;

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title: TITLE, body, state: 'open' });
              if (existing.state === 'closed' || isRelease) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body:
                  `⚠️ ${isRelease ? `Release \`${tag}\` is affected` : 'Back on main'} (${short}, [run](${runUrl})) - see the updated description.` });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body });
            }
