name: Export announcements for the website

# The website (albert-mueller.github.io) lists the discussions of the
# "Announcements" category and offers them as an RSS feed. Its own workflow
# token can't read Discussions of this repo, so this workflow, which can,
# exports them to the `announcements-data` branch. The website build then
# downloads them from raw.githubusercontent.com without needing any token.

on:
  discussion:
    types: [created, edited, deleted, transferred, category_changed, pinned, unpinned]
  discussion_comment:
    types: [created, deleted]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-announcements
  cancel-in-progress: false

jobs:
  export:
    name: Export announcements
    runs-on: ubuntu-latest
    # Only react to discussion activity that can affect the Announcements list.
    if: >-
      github.repository_owner == 'albert-mueller' && (
        (github.event_name != 'discussion' && github.event_name != 'discussion_comment') ||
        github.event.discussion.category.slug == 'announcements' ||
        github.event.action == 'category_changed' ||
        github.event.action == 'transferred'
      )
    permissions:
      contents: write
      discussions: read
    steps:
      - name: Checkout website (for the export script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: albert-mueller/albert-mueller.github.io
          ref: main
          path: site
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Fetch announcements
        working-directory: site
        run: node scripts/fetch-announcements.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOUNCEMENTS_REPO: ${{ github.repository }}

      - name: Publish to announcements-data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir out
          cp site/.vitepress/announcements.json site/public/announcements.xml out/
          cd out
          cat > README.md <<'EOF'
          Generated by .github/workflows/export-announcements.yml on main.
          Used by https://albert-mueller.github.io/announcements/ - do not edit by hand.
          EOF
          sed -i 's/^          //' README.md
          git init -q -b announcements-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update announcements"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth=1 "$remote" announcements-data 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Announcements unchanged - nothing to publish."
            exit 0
          fi
          # Single-commit branch: always replaced, so it never grows.
          git push -q --force "$remote" HEAD:announcements-data
          echo "Published $(grep -c '"number"' announcements.json) announcement(s)."
