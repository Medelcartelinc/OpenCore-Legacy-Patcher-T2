# .github/workflows/dead-code.yml
name: Dead code check

on:
  push:
    branches: [main]
    paths: ['**.py']
  schedule:
    - cron: '0 4 * * *'   # every day 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dead-code
  cancel-in-progress: true

jobs:
  dead-code:
    runs-on: ubuntu-latest
    # don't re-trigger on our own auto-fix merges
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install vulture==2.14 pyflakes==4.0.1

      # Behavior-preserving removals only: unreachable code and unused
      # module-level imports. Imports inside try/if/def are never touched
      # (availability checks like `try: import ssl`). See the script header.
      - name: Remove dead code
        run: python .github/scripts/remove_dead_code.py --report "$RUNNER_TEMP/removed.md"

      # Make sure the cleanup didn't break anything syntactically.
      - name: Sanity check
        run: python -m compileall -q -x '(\.venv|venv|build|dist)/' .

      # Deeper scan (unused functions, classes, unreachable code).
      # Report-only: these can be referenced dynamically (getattr, wx event
      # handlers, plist keys), so they're listed in the PR, not deleted.
      - name: Scan for remaining dead code
        id: vulture
        run: |
          WL=""
          [ -f vulture_whitelist.py ] && WL="vulture_whitelist.py"
          vulture . $WL --min-confidence 60 \
            --exclude ".venv,venv,build,dist" > "$RUNNER_TEMP/vulture.txt" || true
          COUNT=$(wc -l < "$RUNNER_TEMP/vulture.txt")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### Dead code report ($COUNT findings)"
            echo '```'
            head -c 60000 "$RUNNER_TEMP/vulture.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Automated dead-code cleanup."
            echo
            echo "**Removed automatically** (behavior-preserving only: unreachable code and unused top-level imports):"
            echo
            cat "$RUNNER_TEMP/removed.md"
            echo
            echo "Imports that are only needed for their side effect can be protected with \`# noqa\`."
            echo
            echo "**Needs manual review** (vulture, ${{ steps.vulture.outputs.count }} findings — not changed):"
            echo
            echo '```'
            head -c 50000 "$RUNNER_TEMP/vulture.txt"
            echo '```'
            echo
            echo "False positives can be silenced by adding them to \`vulture_whitelist.py\`."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-fix/dead-code
          delete-branch: true
          commit-message: 'Remove dead code (unreachable code, unused top-level imports)'
          title: 'Auto-fix: remove dead code'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: auto-fix
          reviewers: gandolf243

      # Nothing left to fix on main: close a stale auto-fix PR, if any.
      - name: Close outdated auto-fix PR
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close auto-fix/dead-code --delete-branch \
            --comment "Nothing left to remove automatically on main as of ${GITHUB_SHA::7}. Closing." || true

      - name: Report-only findings
        if: steps.diff.outputs.changed == 'false' && steps.vulture.outputs.count != '0'
        run: echo "::warning::vulture found ${{ steps.vulture.outputs.count }} possible dead-code items (no automatic fix). See job summary."
