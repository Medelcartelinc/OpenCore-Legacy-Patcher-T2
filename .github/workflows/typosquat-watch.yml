name: Typosquat watch

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report findings, don't open any issues"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: typosquat-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for typosquatting copies
        env:
          # Classic PAT with the public_repo scope. GITHUB_TOKEN cannot open
          # issues in repositories you don't own.
          GH_TOKEN: ${{ secrets.TYPOSQUAT_PAT }}
          ORIGINAL_REPO: ${{ github.repository }}
          MAX_DISTANCE: "2"            # max typo distance that still counts as a squat
          FINGERPRINT_COMMITS: "20"    # how many of your commits to look for in copies
          CONTACT_SUSPICIOUS: "true"   # also post a notice on repos that look malicious
          ALLOWLIST: ""                # space-separated owner/repo names to ignore
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export DRY_RUN="${{ inputs.dry_run }}"
          else
            # Scheduled runs stay in dry-run mode until you set the repository
            # variable TYPOSQUAT_LIVE=true (Settings → Secrets and variables → Actions → Variables).
            export DRY_RUN="${{ vars.TYPOSQUAT_LIVE == 'true' && 'false' || 'true' }}"
          fi
          python .github/scripts/typosquat_watch.py
